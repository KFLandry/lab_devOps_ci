name: CI Pipeline

# Déclencheurs : Quand exécuter ce workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet l'exécution manuelle depuis l'interface GitHub
  workflow_dispatch:

# Permissions minimales (principe du moindre privilège)
permissions:
  contents: read
  pull-requests: write
  checks: write

#  Annule les exécutions précédentes pour la même PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables d'environnement globales
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ═══════════════════════════════════════════════════════════
  # 📦 JOB 1 : INSTALLATION DES DÉPENDANCES
  # ═══════════════════════════════════════════════════════════
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Cache dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

  # ═══════════════════════════════════════════════════════════
  # ✅ JOB 2 : TESTS UNITAIRES (Vitest)
  # ═══════════════════════════════════════════════════════════
  unit-tests:
    name: ✅ Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🧪 Run unit tests with coverage
        run: pnpm test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unit-tests
          name: unit-tests-coverage

      - name: 📈 Coverage Report Comment
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # 🎭 JOB 3 : TESTS E2E (Playwright)
  # ═══════════════════════════════════════════════════════════
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        # Exécution sur plusieurs navigateurs
        browser: [chromium, firefox, webkit]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: 🗄️ Setup test database
        run: |
          # Configuration de PostgreSQL pour les tests
          docker run -d \
            --name postgres-test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=todo_test \
            -p 5432:5432 \
            postgres:16-alpine

      - name: ⏳ Wait for database
        run: |
          until docker exec postgres-test pg_isready; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: 🔄 Run database migrations
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/todo_test

      - name: 🧪 Run E2E tests
        run: pnpm test:e2e --project=${{ matrix.browser }}
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/todo_test

      - name: 📸 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: 🧹 Cleanup
        if: always()
        run: docker stop postgres-test && docker rm postgres-test

  # ═══════════════════════════════════════════════════════════
  # 💅 JOB 4 : VÉRIFICATION DU FORMATAGE (Prettier)
  # ═══════════════════════════════════════════════════════════
  format-check:
    name: 💅 Format Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🎨 Check code formatting
        run: pnpm format:check

      - name: 📝 Create formatting report
        if: failure()
        run: |
          echo "## ❌ Formatting Issues Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`pnpm format\` to fix formatting issues." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # 🔍 JOB 5 : LINTING (ESLint)
  # ═══════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🔍 Run ESLint
        run: pnpm lint

      - name: 📊 Annotate code with linting errors
        if: failure()
        uses: ataylorme/eslint-annotate-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          report-json: "eslint-report.json"

  # ═══════════════════════════════════════════════════════════
  # 📚 JOB 6 : BUILD STORYBOOK (Documentation)
  # ═══════════════════════════════════════════════════════════
  storybook-build:
    name: 📚 Storybook Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 📚 Build Storybook
        run: pnpm build-storybook

      - name: 🔗 Check for broken links in stories
        run: |
          npx wait-on http://localhost:6006
          npx broken-link-checker http://localhost:6006 --recursive
        continue-on-error: true

      - name: 📤 Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: storybook-static/
          retention-days: 7

      - name: 🚀 Deploy Storybook to Chromatic (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Deploy to Chromatic here if needed"
          # npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # 🏗️ JOB 7 : BUILD APPLICATION
  # ═══════════════════════════════════════════════════════════
  app-build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🏗️ Build application
        run: pnpm build

      - name: 📊 Analyze bundle size
        run: |
          echo "## 📦 Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          du -sh .output >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .output/
          retention-days: 7

# ═══════════════════════════════════════════════════════════
# 🐳 JOB : BUILD & TEST DOCKER COMPOSE
# ═══════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Test
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lint, format-check]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
  
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: 📝 Create .env file for CI
        run: |
          cat > .env << EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=todos_ci
          DATABASE_URL=postgresql://postgres:ci_test_password@postgres:5432/todos_ci
          NODE_ENV=production
          EOF
  
      - name: 🏗️ Build Docker images
        run: docker compose build --no-cache
  
      - name: 🚀 Start services
        run: docker compose up -d
  
      - name: ⏳ Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done'
          
          echo "Waiting for app..."
          timeout 90 bash -c 'until curl -f http://localhost:3000/healthz; do sleep 3; done'
  
      - name: 🧪 Run integration smoke tests
        run: |
          # Test de santé de l'app
          curl -f http://localhost:3000/healthz || exit 1
          
          # Test de connexion à la DB
          docker compose exec -T postgres psql -U postgres -d todos_ci -c "SELECT version();"
  
      - name: 📊 Show logs on failure
        if: failure()
        run: |
          echo "=== App Logs ==="
          docker compose logs todo-app
          echo "=== PostgreSQL Logs ==="
          docker compose logs postgres
  
      - name: 📈 Analyze image sizes
        run: |
          echo "## 🐳 Docker Images Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "todo|postgres" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
  
      - name: 🧹 Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -f
  
      - name: 🔐 Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  
      - name: 🏷️ Extract metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: votre-username/todo-app
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
  
      - name: 📤 Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag todo-app:latest votre-username/todo-app:latest
          docker push votre-username/todo-app:latest
  # ═══════════════════════════════════════════════════════════
  # ✅ JOB FINAL : STATUT GLOBAL
  # ═══════════════════════════════════════════════════════════
  ci-success:
    name: ✅ CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lint, format-check, app-build, docker-build, storybook-build]
    if: always()
    steps:
      - name: 🎉 All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "## ✅ CI Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All quality checks have passed. Ready to merge! 🚀" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Some checks failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "## ❌ CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the failed jobs above." >> $GITHUB_STEP_SUMMARY
          exit 1
