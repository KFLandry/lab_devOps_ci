name: CI Pipeline

# Déclencheurs : Quand exécuter ce workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet l'exécution manuelle depuis l'interface GitHub
  workflow_dispatch:

# Permissions minimales (principe du moindre privilège)
permissions:
  contents: read
  pull-requests: write
  checks: write

#  Annule les exécutions précédentes pour la même PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables d'environnement globales
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ═══════════════════════════════════════════════════════════
  # 📦 JOB 1 : INSTALLATION DES DÉPENDANCES
  # ═══════════════════════════════════════════════════════════
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Cache dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

  # ═══════════════════════════════════════════════════════════
  # ✅ JOB 2 : TESTS UNITAIRES (Vitest)
  # ═══════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🧪 Run unit tests with coverage
        run: pnpm test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unit-tests
          name: unit-tests-coverage

      - name: 📈 Coverage Report Comment
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # 🎭 JOB 3 : TESTS E2E (Playwright)
  # ═══════════════════════════════════════════════════════════
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false # Continue même si un navigateur échoue
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: 🗄️ Setup PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_DB=todos_test \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            postgres:16-alpine

      - name: ⏳ Wait for PostgreSQL
        run: |
          timeout 60 bash -c 'until docker exec postgres-test pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done'

      - name: 🔄 Run database migrations
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/todos_test

      - name: 🧪 Run E2E tests
        run: pnpm test:e2e --project=${{ matrix.browser }}
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/todos_test
          CI: true

      - name: 📸 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker stop postgres-test || true
          docker rm postgres-test || true

  # ═══════════════════════════════════════════════════════════
  # 💅 JOB 4 : VÉRIFICATION DU FORMATAGE (Prettier)
  # ═══════════════════════════════════════════════════════════
  format-check:
    name: 💅 Format Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🎨 Check code formatting
        run: pnpm format:check

      - name: 📝 Create formatting report
        if: failure()
        run: |
          echo "## ❌ Formatting Issues Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`pnpm format\` to fix formatting issues." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # 🔍 JOB 5 : LINTING (ESLint)
  # ═══════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🔍 Run ESLint
        run: pnpm lint

      - name: 📊 Annotate code with linting errors
        if: failure()
        uses: ataylorme/eslint-annotate-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          report-json: 'eslint-report.json'

  # ═══════════════════════════════════════════════════════════
  # 📚 JOB 6 : BUILD STORYBOOK (Documentation)
  # ═══════════════════════════════════════════════════════════
  storybook-build:
    name: 📚 Storybook Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 📚 Build Storybook
        run: pnpm build-storybook

      - name: 📤 Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: storybook-static/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # 🏗️ JOB 7 : BUILD APPLICATION
  # ═══════════════════════════════════════════════════════════
  app-build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 💾 Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🏗️ Build application
        run: pnpm build

      - name: 📊 Analyze bundle size
        run: |
          echo "## 📦 Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          du -sh .output >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .output/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # 🐳 JOB : BUILD & TEST DOCKER COMPOSE
  # ═══════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Test
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lint, format-check]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Create .env from secrets
        run: |
          cat > .env << EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=todos
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/todos
          NODE_ENV=production
          EOF

      - name: 🏗️ Build Docker images
        run: docker compose build --no-cache

      - name: 🚀 Start services
        run: docker compose up -d

      - name: ⏳ Wait for app
        run: |
          echo "Waiting for app to start..."
          timeout 90 bash -c 'until curl -f -s -o /dev/null http://localhost:3000; do
            echo "App not ready yet..."
            sleep 3
          done'
          echo "✅ App is responding!"

      - name: 🧪 Run integration smoke tests
        run: |
          # Test que l'app répond (même sans /healthz)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 404 ]; then
            echo "✅ App is running (HTTP $HTTP_CODE)"
          else
            echo "❌ App returned unexpected code: $HTTP_CODE"
            exit 1
          fi

      - name: 📊 Show logs on failure
        if: failure()
        run: |
          echo "=== App Logs ==="
          docker compose logs todo-app
          echo "=== PostgreSQL Logs ==="
          docker compose logs postgres

      - name: 📈 Analyze image sizes
        run: |
          echo "## 🐳 Docker Images Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "todo|postgres" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -f
  # ═══════════════════════════════════════════════════════════
  # ✅ JOB FINAL : STATUT GLOBAL
  # ═══════════════════════════════════════════════════════════
  ci-success:
    name: ✅ CI Pipeline Success
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        e2e-tests,
        lint,
        format-check,
        app-build,
        docker-build,
        storybook-build,
      ]
    if: always()
    steps:
      - name: 🎉 All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "## ✅ CI Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All quality checks have passed. Ready to merge! 🚀" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Some checks failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "## ❌ CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the failed jobs above." >> $GITHUB_STEP_SUMMARY
          exit 1
